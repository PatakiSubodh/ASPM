services:
  neo4j:
    image: neo4j:5.24-community
    container_name: aspm-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-aspm_dev_password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: aspm-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-aspm_dev_password}
      - ASPM_API_KEY=${ASPM_API_KEY:-}
      - CATALOG_PATH=/app/catalog.yaml
    volumes:
      - ./catalog.yaml:/app/catalog.yaml:ro
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://api:8000
    container_name: aspm-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - ASPM_API_KEY=${ASPM_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy

  scanner:
    build: ./scanner
    container_name: aspm-scanner
    restart: unless-stopped
    environment:
      - ASPM_API_URL=http://api:8000
      - ASPM_API_KEY=${ASPM_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SCAN_INTERVAL_MINUTES=${SCAN_INTERVAL_MINUTES:-360}
      - SCAN_ON_START=${SCAN_ON_START:-true}
    volumes:
      - ./catalog.yaml:/app/catalog.yaml:ro
      - trivy_cache:/cache/trivy
    depends_on:
      api:
        condition: service_healthy

  demo-seed:
    image: neo4j:5.24-community
    profiles: ["demo"]
    restart: "no"
    volumes:
      - ./demo:/demo:ro
    entrypoint: ["cypher-shell", "-a", "bolt://neo4j:7687", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-aspm_dev_password}", "-f", "/demo/seed.cypher"]
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  trivy_cache:
